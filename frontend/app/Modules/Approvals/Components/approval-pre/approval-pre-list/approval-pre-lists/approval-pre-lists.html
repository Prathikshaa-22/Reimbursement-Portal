<div class="container mt-4">
 
  <h4 class="mb-3">Pending Pre-Approvals</h4>
 
  <!-- No Data -->
  <div *ngIf="preList.length === 0" class="text-center text-muted">
    No pending pre-approvals
  </div>
 
  <!-- List -->
  <div *ngFor="let item of preList"
       class="card p-3 mb-3 shadow pre-card"
       (click)="openDetails(item.preApprovalId)">
 
    <div class="d-flex justify-content-between align-items-center">
 
      <!-- LEFT -->
      <div>
        <h6 class="mb-1">{{item.title}}</h6>
        <small class="text-muted">
          Submitted by: {{item.employeeName}}
        </small>
      </div>
 
      <!-- RIGHT -->
      <span class="badge bg-warning">Pending</span>
 
    </div>
 
  </div>
 
</div>
