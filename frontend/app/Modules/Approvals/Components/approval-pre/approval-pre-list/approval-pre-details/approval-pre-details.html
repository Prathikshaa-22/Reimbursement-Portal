<div class="container mt-4" *ngIf="pre">
 
  <div class="card p-4 shadow">
 
    <h4 class="mb-3">{{pre.title}}</h4>
 
    <div class="row">
 
      <div class="col-md-6">
        <p><strong>Employee:</strong> {{pre.employeeName}}</p>
        <p><strong>Planned Date:</strong> {{pre.plannedDate | date}}</p>
      </div>
 
      <div class="col-md-6">
        <p><strong>Estimated Amount:</strong> ₹{{pre.estimatedAmount}}</p>
      </div>
 
    </div>
 
    <hr>
 
    <p><strong>Description:</strong></p>
    <p>{{pre.description}}</p>
 
    <!-- ACTION -->
    <div class="text-end mt-4">
 
      <button class="btn btn-success me-2"
              (click)="takeAction('Approved')">
        Accept
      </button>
 
      <button class="btn btn-danger"
              (click)="takeAction('Rejected')">
        Reject
      </button>
 
    </div>
 
  </div>
 
</div>
